# Controller manager configuration
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # === Broadcasters ===
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # === Controllers ===
    # This controller is used to send velocity commands to the driving wheels
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# Parameters for the Joint State Broadcaster
joint_state_broadcaster:
  ros__parameters:
    # The list of joints that this broadcaster will publish the state for
    joints:
      - rear_left_wheel_joint
      - rear_right_wheel_joint
      - front_left_wheel_joint
      - front_right_wheel_joint

# Parameters for the Differential Drive Controller
diff_drive_controller:
  ros__parameters:
    # Driving wheel joints
    left_wheel_names: ["rear_left_wheel_joint"]
    right_wheel_names: ["rear_right_wheel_joint"]
    
    wheel_separation: 0.6 # Corresponds to 2 * y-distance of rear wheels
    wheel_radius: 0.15   # Must match the radius in the URDF
    
    # Odometry settings
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    
    # Use the odometry from our hardware interface instead of calculating it here
    use_stamped_vel: false
    
    # Command timeout
    cmd_vel_timeout: 0.5
